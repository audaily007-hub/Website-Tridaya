name: 🚀 Build Vite and Deploy to Rumahweb

on:
  push:
    branches:
      - main # Mendeteksi otomatis push dari Google AI Studio ke branch main

jobs:
  build-and-deploy:
    name: 🏗️ Vite Build & FTP Sync
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Ambil kode terbaru dari GitHub
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependency & Build Vite
      run: |
        npm install
        npm run build # Perintah ini otomatis membuat folder 'dist' di server GitHub

    - name: 📂 Kirim isi folder dist ke cPanel via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/ # Folder output bawaan dari Vite
        server-dir: /public_html/ # Target folder utama di cPanel Rumahweb
