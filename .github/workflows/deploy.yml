name: 📦 Build Vite and Create Downloadable ZIP

on:
  push:
    branches:
      - main # Terpicu setiap Anda commit dari Google AI Studio ke branch main

jobs:
  build-project:
    name: 🏗️ Vite Production Build
    runs-on: ubuntu-latest

    steps:
    - name: 🚚 Ambil kode terbaru dari GitHub
      uses: actions/checkout@v4

    - name: 🟢 Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: 📦 Install Dependency & Build Vite
      run: |
        npm install
        npm run build # Membuat folder 'dist' otomatis di server GitHub

    - name: 📤 Sediakan Folder dist Sebagai File ZIP Siap Unduh
      uses: actions/upload-artifact@v4
      with:
        name: hasil-build-vite # Nama file ZIP yang akan Anda unduh nanti
        path: ./dist/ # Target folder keluaran Vite yang akan dibungkus jadi ZIP
        retention-days: 5 # File ZIP otomatis dihapus dari GitHub setelah 5 hari demi menghemat ruang
